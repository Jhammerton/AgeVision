[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agevision"
version = "0.1.0"
description = "Facial apparent-age estimation with PyTorch and FastAPI"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "numpy>=1.24", "pandas>=2.0", "pillow>=10.0",
  "opencv-python-headless>=4.10,<5", "python-multipart>=0.0.9", "pyyaml>=6.0",
  "scikit-learn>=1.3", "torch>=2.1", "torchvision>=0.16", "uvicorn[standard]>=0.27"]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=7.4", "ruff>=0.3"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["assets/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
