<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AgeVision</title><style>
:root{font-family:Inter,system-ui;color:#172033;background:#eef3f8}body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(760px,88vw);background:white;padding:3rem;border-radius:24px;box-shadow:0 20px 70px #23324b20}.tag{color:#356ae6;font-weight:700;letter-spacing:.12em}h1{font-size:clamp(2.5rem,8vw,5rem);margin:.2em 0}p{line-height:1.6;color:#526077}.drop{display:block;border:2px dashed #a9b9d1;border-radius:16px;padding:2.5rem;text-align:center;margin:2rem 0;cursor:pointer}button{background:#356ae6;color:white;border:0;padding:.9rem 1.4rem;border-radius:10px;font-weight:700;cursor:pointer}#result{font-size:1.4rem;font-weight:700;margin-top:1.5rem}.note{font-size:.82rem}input{max-width:100%}</style></head><body><main><div class="tag">RESPONSIBLE COMPUTER VISION</div><h1>AgeVision</h1><p>Upload a clear portrait to estimate apparent age. Your image is processed for this request and is not stored.</p><form id="form"><label class="drop">Choose a JPEG, PNG, or WebP image<br><br><input name="file" type="file" accept="image/jpeg,image/png,image/webp" required></label><button>Estimate apparent age</button></form><div id="result" aria-live="polite"></div><p class="note">An appearance estimate is not a person's verified chronological age. Do not use it for consequential decisions.</p><script>form.onsubmit=async(e)=>{e.preventDefault();result.textContent='Analyzing…';const r=await fetch('/api/v1/predict',{method:'POST',body:new FormData(form)});const d=await r.json();result.textContent=r.ok?(d.predicted_age!==undefined?`Predicted age: ${d.predicted_age} · Estimated range: ${d.estimated_range[0]}–${d.estimated_range[1]}`:`Age group: ${d.age_group}`):`Unable to predict: ${d.detail}`}</script></main></body></html>
